<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Job Application Form – HapplyMate Test Portal</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        border: 1px solid #e2e8f0;
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
        color: #0f172a;
      }
      p.subtitle {
        color: #64748b;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
        color: #334155;
      }
      label .req {
        color: #ef4444;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="url"],
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .btn-submit {
        background: #4f46e5;
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 12px;
      }
      .btn-submit:hover {
        background: #4338ca;
      }
      .banner {
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        color: #3730a3;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="banner">
        💡 <strong>HapplyMate Test Portal</strong>: Open your HapplyMate Extension Side Panel on this page and click <em>"Scan Form"</em> to observe automatic field detection and 1-click autofill!
      </div>

      <h1>Senior Software Engineer Application</h1>
      <p class="subtitle">Tech Innovations Inc. • San Francisco, CA • Full-time</p>

      <form id="application-form">
        <div class="grid">
          <div class="form-group">
            <label for="first_name">First Name <span class="req">*</span></label>
            <input type="text" id="first_name" name="first_name" autocomplete="given-name" required />
          </div>
          <div class="form-group">
            <label for="last_name">Last Name <span class="req">*</span></label>
            <input type="text" id="last_name" name="last_name" autocomplete="family-name" required />
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label for="email">Email Address <span class="req">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number <span class="req">*</span></label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" required />
          </div>
        </div>

        <div class="form-group">
          <label for="address">Street Address</label>
          <input type="text" id="address" name="address" autocomplete="address-line1" />
        </div>

        <div class="grid">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" />
          </div>
          <div class="form-group">
            <label for="zip_code">Postal / Zip Code</label>
            <input type="text" id="zip_code" name="zip_code" />
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label for="linkedin_url">LinkedIn Profile</label>
            <input type="url" id="linkedin_url" name="urls[LinkedIn]" placeholder="https://linkedin.com/in/..." />
          </div>
          <div class="form-group">
            <label for="github_url">GitHub Profile</label>
            <input type="url" id="github_url" name="urls[GitHub]" placeholder="https://github.com/..." />
          </div>
        </div>

        <div class="form-group">
          <label for="work_auth">Are you authorized to work in this country? <span class="req">*</span></label>
          <select id="work_auth" name="work_authorization" required>
            <option value="">-- Please Select --</option>
            <option value="Authorized to work">Yes, I am authorized to work</option>
            <option value="Requires sponsorship">No, I require visa sponsorship</option>
          </select>
        </div>

        <div class="form-group">
          <label for="resume_file">Resume / CV File</label>
          <input type="file" id="resume_file" name="resume" accept=".pdf,.doc,.docx" />
        </div>

        <div class="form-group">
          <label for="cover_letter">Additional Information / Note to Hiring Manager</label>
          <textarea id="cover_letter" name="cover_letter" rows="4"></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Application</button>
      </form>
    </div>
  </body>
</html>
