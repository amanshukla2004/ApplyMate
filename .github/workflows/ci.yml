name: CI & Extension Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite (73 Tests)
        run: npm test

      - name: Build Extension (Vite & Content Script)
        run: npm run build

      - name: Release Audit & Manifest Verification
        run: node scripts/verifyRelease.js
