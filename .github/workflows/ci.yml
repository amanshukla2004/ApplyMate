name: CI & Extension Quality Gate

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Test Suite
        run: npm test

      - name: Build Extension (Vite & Content Script)
        run: npm run build

      - name: Package Extension ZIPs
        run: |
          cd dist
          zip -r ../happlied.zip .
          cd ..
          cp happlied.zip happlymate.zip
          cp happlied.zip applymate.zip

      - name: Release Audit & Manifest Verification
        run: node scripts/verifyRelease.js

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happlied-extension-build
          path: |
            extension/*.zip
            extension/dist/
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: happlied-extension-build
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
